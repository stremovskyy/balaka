[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "balaka"
version = "0.3.0"
description = "Local TTS backend with a separate frontend."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
keywords = ["tts", "speech", "fastapi", "local-inference", "voice-cloning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "fastapi==0.162.0",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
    "pydantic-settings==2.16.1",
    "python-multipart==0.0.32",
]

[project.urls]
Homepage = "https://github.com/stremovskyy/balaka"
Repository = "https://github.com/stremovskyy/balaka.git"

[project.scripts]
balaka = "balaka.main:run"

[project.optional-dependencies]
dev = [
    "httpx2==2.16.0",
    "numpy==2.4.4",
    "pytest==9.0.2",
]
runtime = [
    "omnivoice==0.2.1",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "transformers==5.3.0",
    "numpy==2.4.4",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
